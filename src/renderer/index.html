<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Tool - Markdown 编辑器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 自定义标题栏 -->
    <div id="custom-titlebar" data-tauri-drag-region>
      <img id="app-icon" src="icon.svg" alt="">
      <span id="file-path">未命名</span>
      <div id="titlebar-actions" data-tauri-no-drag>
        <button id="btn-theme" title="切换主题" aria-label="切换主题">🌙</button>
      </div>
      <div id="window-controls" data-tauri-no-drag>
        <button id="btn-minimize" title="最小化" aria-label="最小化">─</button>
        <button id="btn-maximize" title="最大化" aria-label="最大化">□</button>
        <button id="btn-close" title="关闭" aria-label="关闭">✕</button>
      </div>
    </div>

    <!-- 标签栏 -->
    <div id="tab-bar">
      <div id="tabs-container"></div>
      <button id="btn-new-tab" title="新建文件">+</button>
    </div>

    <!-- 菜单栏 -->
    <div id="menubar">
      <div class="menu-item" id="menu-file">
        <span>文件</span>
        <div class="dropdown" id="dropdown-file">
          <div class="dropdown-item" id="menu-new-file">
            <span class="item-icon">📄</span>新建文件
            <span class="item-shortcut">Ctrl+N</span>
          </div>
          <div class="dropdown-item" id="menu-open-file">
            <span class="item-icon">📂</span>打开文件
            <span class="item-shortcut">Ctrl+O</span>
          </div>
          <div class="dropdown-item" id="menu-open-folder"><span class="item-icon">📁</span>打开文件夹</div>
          <div class="dropdown-separator"></div>
          <div class="dropdown-item" id="menu-save-file">
            <span class="item-icon">💾</span>保存
            <span class="item-shortcut">Ctrl+S</span>
          </div>
          <div class="dropdown-item" id="menu-save-as">
            <span class="item-icon">📋</span>另存为
            <span class="item-shortcut">Ctrl+Shift+S</span>
          </div>
          <div class="dropdown-separator"></div>
          <div class="dropdown-item" id="menu-export-html">
            <span class="item-icon">🌐</span>导出 HTML
          </div>
          <div class="dropdown-item disabled-item" id="menu-export-pdf" title="PDF 导出暂不支持">
            <span class="item-icon">📑</span>导出 PDF
          </div>
        </div>
      </div>
      <div class="menu-item" id="menu-view">
        <span>视图</span>
        <div class="dropdown" id="dropdown-view">
          <div class="dropdown-item" id="menu-toggle-explorer">
            <span class="item-icon">🗂</span>切换资源管理器
          </div>
          <div class="dropdown-item" id="menu-toggle-toc">
            <span class="item-icon">☰</span>切换目录面板
          </div>
          <div class="dropdown-item" id="menu-toggle-split">
            <span class="item-icon">⊟</span>切换分屏模式
          </div>
          <div class="dropdown-separator"></div>
          <div class="dropdown-item" id="menu-focus-mode">
            <span class="item-icon">◎</span>专注模式
            <span class="item-shortcut">F11</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 格式化工具栏 -->
    <div id="toolbar">
      <div class="toolbar-group">
        <button class="toolbar-btn" id="tb-bold" title="粗体 (Ctrl+B)"><b>B</b></button>
        <button class="toolbar-btn" id="tb-italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button class="toolbar-btn" id="tb-strike" title="删除线"><s>S</s></button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn" id="tb-h1" title="一级标题">H1</button>
        <button class="toolbar-btn" id="tb-h2" title="二级标题">H2</button>
        <button class="toolbar-btn" id="tb-h3" title="三级标题">H3</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn icon-btn" id="tb-ul" title="无序列表">≡</button>
        <button class="toolbar-btn icon-btn" id="tb-ol" title="有序列表">①</button>
        <button class="toolbar-btn icon-btn" id="tb-task" title="任务列表">☑</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn icon-btn" id="tb-code" title="行内代码">`</button>
        <button class="toolbar-btn icon-btn" id="tb-codeblock" title="代码块">⌥</button>
        <button class="toolbar-btn icon-btn" id="tb-quote" title="引用块">❝</button>
        <button class="toolbar-btn icon-btn" id="tb-link" title="插入链接">🔗</button>
        <button class="toolbar-btn icon-btn" id="tb-table" title="插入表格">⊞</button>
        <button class="toolbar-btn icon-btn" id="tb-hr" title="水平分割线">─</button>
      </div>
      <div id="toolbar-right">
        <button id="btn-split-view" title="分屏预览">⊟ 分屏</button>
      </div>
    </div>

    <!-- 主内容区 -->
    <div id="main-content">
      <!-- 文件树侧边栏 -->
      <div id="file-tree-panel">
        <div class="file-tree-header">
          <span class="file-tree-title">资源管理器</span>
          <button id="btn-refresh-tree" class="file-tree-action" type="button" title="刷新资源管理器">↻</button>
        </div>
        <div id="file-tree" aria-live="polite">
          <div class="file-tree-empty file-tree-empty-hint" id="file-tree-empty-hint">
            <span>尚未打开文件夹</span>
            <button class="file-tree-open-btn" id="btn-open-folder-from-tree" type="button">打开文件夹…</button>
          </div>
        </div>
      </div>

      <!-- TOC 侧边栏 -->
      <div id="toc-panel">
        <div class="toc-header">
          <span class="toc-title">目录</span>
        </div>
        <div id="toc-body">
          <div id="toc"><div class="toc-empty">暂无目录</div></div>
        </div>
      </div>

      <!-- 编辑器区域 -->
      <div id="editor-area">
        <!-- WYSIWYG 预览编辑区 -->
        <div id="wysiwyg-editor"></div>

        <!-- 原始 Markdown 分屏编辑区 -->
        <div id="raw-editor">
          <div class="raw-editor-header">Markdown 源码</div>
          <textarea id="raw-textarea" spellcheck="false" placeholder="在此输入 Markdown..."></textarea>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div id="statusbar">
      <div class="status-item">
        <span class="status-dot"></span>
        <span id="status-mode">预览模式</span>
      </div>
      <div class="status-item" id="status-file-info">
        <span id="status-encoding">UTF-8</span>
      </div>
      <div class="status-item" id="status-words">
        <span id="status-word-count">0 字</span>
        <span class="status-separator">|</span>
        <span id="status-line-count">0 行</span>
        <span class="status-separator">|</span>
        <span id="status-char-count">0 字符</span>
      </div>
    </div>
  </div>

  <!-- Toast 通知容器 -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="tauri-api.bundle.js"></script>
  <script src="purify.min.js"></script>
  <script src="marked.min.js"></script>
  <script src="hljs.bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
